<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6b4dfb">
<title>Family Points has moved</title>
<link rel="canonical" href="https://nimrodf8.github.io/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<!-- A courtesy for a browser with scripting off. The script below goes first
     and carries the address's fragment across; this one cannot, but a visitor
     without scripting could not run the app anyway. -->
<meta http-equiv="refresh" content="3; url=https://nimrodf8.github.io/">
<style>
  :root {
    --bg: #f6f5fb; --surface: #ffffff; --line: #e3e0f0;
    --ink: #1d1b32; --ink-soft: #5c5878; --brand: #6b4dfb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14131d; --surface: #1e1c2b; --line: #322e47;
      --ink: #f2f0fb; --ink-soft: #a49fc0; --brand: #8f76ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14131d; --surface: #1e1c2b; --line: #322e47;
    --ink: #f2f0fb; --ink-soft: #a49fc0; --brand: #8f76ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans Hebrew", Arial, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px 24px; max-width: 460px; text-align: center;
    box-shadow: 0 8px 28px rgba(35, 25, 80, .08); }
  .mark { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 14px;
    background: linear-gradient(140deg, var(--brand), #ff8a3d);
    display: grid; place-items: center; font-size: 1.6rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .5em; }
  p { color: var(--ink-soft); line-height: 1.6; margin: .5em 0; }
  a.go { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 13px;
    background: var(--brand); color: #fff; font-weight: 700; text-decoration: none; }
  code { font-size: .82rem; color: var(--ink-soft); overflow-wrap: anywhere; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🏆</div>
    <h1>Family Points has a shorter address</h1>
    <p>It now lives at <code>https://nimrodf8.github.io/</code> — you are being
       taken there. Your family, your sign-in and your points are all still
       there: it is the same site, on the same domain.</p>
    <p>Update your bookmark when you arrive.</p>
    <a class="go" href="https://nimrodf8.github.io/">Go to Family Points</a>
  </div>
<script>
  /* An invite link made before the move carries its family in the fragment
     (#join=…). Send it along, or the invitation would be lost on the way. */
  (function () {
    var target = "https://nimrodf8.github.io/" + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
</body>
</html>
